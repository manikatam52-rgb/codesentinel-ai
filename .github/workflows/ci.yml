name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codesentinel
          POSTGRES_PASSWORD: codesentinel
          POSTGRES_DB: codesentinel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codesentinel"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://codesentinel:codesentinel@localhost:5432/codesentinel
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r ai-service/requirements.txt pytest
      - run: pytest ai-service/tests -q

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    if: github.event_name == 'push'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codesentinel
          POSTGRES_PASSWORD: codesentinel
          POSTGRES_DB: codesentinel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codesentinel"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://codesentinel:codesentinel@localhost:5432/codesentinel
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
        working-directory: server
      - run: node dist/app.js &
        working-directory: server
      - run: npm ci && npx vite build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e tests
        working-directory: .
        env:
          E2E_NO_SERVER: '1'
        run: |
          cd web && npx vite preview --port 5173 &
          sleep 8
          cd ../e2e && npx playwright test
